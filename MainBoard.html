<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Комплаенс таблица</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            overflow: hidden;
        }
        header {
            background: #2c3e50;
            color: white;
            padding: 25px 30px;
            border-bottom: 4px solid #3498db;
        }
        h1 {
            margin: 0;
            font-size: 28px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        h1:before {
            content: "📋";
            font-size: 32px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            background: #34495e;
            color: white;
            padding: 18px 20px;
            text-align: left;
            font-weight: 600;
            font-size: 16px;
        }
        td {
            padding: 0;
            border-bottom: 1px solid #ecf0f1;
        }
        .topic-row {
            background: white;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .topic-row:hover {
            background: #f8fafc;
            transform: translateY(-1px);
        }
        .topic-content {
            padding: 18px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .topic-title {
            font-weight: 600;
            color: #2c3e50;
            font-size: 16px;
        }
        .toggle-btn {
            color: #3498db;
            font-weight: bold;
            font-size: 18px;
            transition: transform 0.3s ease;
        }
        .subtopics {
            background: #f8fafc;
            display: none;
        }
        .subtopic {
            padding: 14px 20px 14px 50px;
            color: #555;
            border-top: 1px dashed #d5dbdb;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .subtopic:before {
            content: "→";
            color: #3498db;
            font-weight: bold;
        }
        .status {
            padding: 18px 20px;
            font-weight: 500;
        }
        .progress-cell {
            padding: 18px 20px;
        }
        .progress-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .progress-bar {
            width: 120px;
            height: 10px;
            background: #ecf0f1;
            border-radius: 5px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #2ecc71, #1abc9c);
            border-radius: 5px;
            width: 0%;
            transition: width 1s ease-in-out;
        }
        .progress-text {
            font-weight: 600;
            color: #2c3e50;
            min-width: 40px;
        }
        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }
        .status-studying {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }
        .status-completed {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .status-pending {
            background: #f8f9fa;
            color: #6c757d;
            border: 1px solid #e9ecef;
        }
        footer {
            text-align: center;
            padding: 20px;
            color: #7f8c8d;
            font-size: 14px;
            border-top: 1px solid #ecf0f1;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>План подготовки: Комплаенс 115-ФЗ</h1>
            <p style="margin-top: 8px; opacity: 0.9; font-size: 15px;">Интерактивная таблица прогресса по темам</p>
        </header>
        
        <table>
            <thead>
                <tr>
                    <th width="50%">Тема / Тип задания</th>
                    <th width="25%">Статус</th>
                    <th width="25%">Прогресс</th>
                </tr>
            </thead>
            <tbody id="table-body">
                <!-- Данные загружаются через JavaScript -->
            </tbody>
        </table>
        
        <footer>
            Обновлено: <span id="current-date"></span> | Кликните на тему для просмотра подтем
        </footer>
    </div>

    <script>
        const tableData = [
            {
                title: "115-ФЗ: Основные понятия и термины",
                subtopics: [
                    "Определение ПОД/ФТ и цели законодательства",
                    "Бенефициарный владелец vs выгодоприобретатель",
                    "Риск-ориентированный подход (РОП)",
                    "Обязанности кредитных организаций"
                ],
                status: "studying",
                progress: 65
            },
            {
                title: "Санкционный комплаенс",
                subtopics: [
                    "Отличие OFAC/ЕС от российских требований",
                    "Проверка по спискам (СПФС, OFAC, ЕС)",
                    "Процедура блокировки средств",
                    "Отчетность в Росфинмониторинг"
                ],
                status: "completed",
                progress: 100
            },
            {
                title: "Красные флаги и подозрительные операции",
                subtopics: [
                    "Схемы обналичивания (cashing-out)",
                    "Операции с криптоактивами",
                    "Транзитные операции без экономического смысла",
                    "Признаки фирм-однодневок"
                ],
                status: "studying",
                progress: 40
            },
            {
                title: "Внутренний контроль и документация",
                subtopics: [
                    "Разработка правил внутреннего контроля",
                    "Ведение досье клиентов",
                    "Порядок хранения информации",
                    "Обучение сотрудников"
                ],
                status: "pending",
                progress: 20
            },
            {
                title: "Расследование и отчётность (СПО)",
                subtopics: [
                    "Сбор информации по клиенту",
                    "Анализ транзакций и связей",
                    "Подготовка Сообщения о подозрительной операции",
                    "Взаимодействие с правоохранительными органами"
                ],
                status: "pending",
                progress: 10
            }
        ];

        const statusConfig = {
            studying: { text: "В процессе", class: "status-studying" },
            completed: { text: "Изучено", class: "status-completed" },
            pending: { text: "Ожидает", class: "status-pending" }
        };

        function renderTable() {
            const tableBody = document.getElementById('table-body');
            tableBody.innerHTML = '';

            tableData.forEach((item, index) => {
                const status = statusConfig[item.status];
                
                // Основная строка
                const mainRow = document.createElement('tr');
                mainRow.className = 'topic-row';
                mainRow.setAttribute('data-index', index);
                
                mainRow.innerHTML = `
                    <td>
                        <div class="topic-content">
                            <span class="topic-title">${item.title}</span>
                            <span class="toggle-btn">▼</span>
                        </div>
                    </td>
                    <td class="status">
                        <span class="status-badge ${status.class}">${status.text}</span>
                    </td>
                    <td class="progress-cell">
                        <div class="progress-container">
                            <div class="progress-bar">
                                <div class="progress-fill" id="progress-${index}"></div>
                            </div>
                            <span class="progress-text">${item.progress}%</span>
                        </div>
                    </td>
                `;
                
                tableBody.appendChild(mainRow);
                
                // Строка с подтемами
                if (item.subtopics.length > 0) {
                    const subtopicRow = document.createElement('tr');
                    subtopicRow.className = 'subtopics';
                    subtopicRow.id = `subtopics-${index}`;
                    
                    subtopicRow.innerHTML = `
                        <td colspan="3">
                            ${item.subtopics.map(sub => 
                                `<div class="subtopic">${sub}</div>`
                            ).join('')}
                        </td>
                    `;
                    
                    tableBody.appendChild(subtopicRow);
                }
            });

            // Анимация прогресс-баров
            setTimeout(() => {
                tableData.forEach((item, index) => {
                    const progressFill = document.getElementById(`progress-${index}`);
                    if (progressFill) {
                        progressFill.style.width = `${item.progress}%`;
                    }
                });
            }, 300);

            // Обработчики кликов
            document.querySelectorAll('.topic-row').forEach(row => {
                row.addEventListener('click', function() {
                    const index = this.getAttribute('data-index');
                    const subtopicRow = document.getElementById(`subtopics-${index}`);
                    const toggleBtn = this.querySelector('.toggle-btn');
                    
                    if (subtopicRow) {
                        const isVisible = subtopicRow.style.display === 'table-row';
                        subtopicRow.style.display = isVisible ? 'none' : 'table-row';
                        toggleBtn.textContent = isVisible ? '▼' : '▲';
                    }
                });
            });
        }

        // Установка текущей даты
        document.getElementById('current-date').textContent = 
            new Date().toLocaleDateString('ru-RU', {
                day: 'numeric',
                month: 'long',
                year: 'numeric'
            });

        // Инициализация
        document.addEventListener('DOMContentLoaded', renderTable);
    </script>
</body>
</html>
